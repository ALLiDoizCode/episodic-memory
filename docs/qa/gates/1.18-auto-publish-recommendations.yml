security_review: |
  ✓ NO CONCERNS

  1. **Input Validation**:
     - Config values validated with Zod schema
     - Database inputs use prepared statements (no SQL injection)
     - Conversation IDs are internal (not user-controllable)

  2. **Data Integrity**:
     - Foreign key constraints prevent orphaned suggestions
     - ON DELETE CASCADE ensures cleanup
     - Primary key prevents duplicate suggestions

  3. **Session Hook Safety**:
     - TTY check prevents hanging in CI environments
     - Silent exit on errors (doesn't block session end)
     - No network calls (all local operations)

  4. **Configuration Security**:
     - Config stored in user's home directory (~/.episodic-memory/config.json)
     - No sensitive data in suggestion records
     - Skill IDs are public Arweave transaction IDs (intended to be public)

performance_considerations: |
  ✓ EXCELLENT

  1. **Session-End Hook Performance (<2s requirement)**:
     - Database queries: <1ms (indexed timestamp query)
     - Heuristic analysis: <10ms (O(n) with typical 10-50 exchanges)
     - Total time: ~15ms (well under 2s requirement)

  2. **Optimization Strategies**:
     - TTY check for non-interactive skip (line 27)
     - Silent exit for non-worthy conversations (no prompt overhead)
     - Index on timestamp ensures fast last conversation query
     - Short-circuit: user signal skips other heuristic checks (line 179)

  3. **Heuristic Efficiency**:
     - All heuristics are O(n) where n = number of exchanges
     - Error tool call filtering: O(n) but avoids false positives
     - Code block regex: efficient (non-backtracking pattern)
     - Keyword matching: case-insensitive but only 9 keywords (fast)

  4. **Database Performance**:
     - Prepared statements cached by better-sqlite3
     - Foreign key checks are fast (indexed conversation_id)
     - No N+1 queries (tool calls loaded in batch)

